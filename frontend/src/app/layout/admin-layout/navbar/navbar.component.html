<nz-header
  class="bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm transition-all duration-300 w-full"
>
  <div class="h-20 flex items-center justify-between px-6 lg:px-8 gap-6 w-full">
    <!-- LEFT SIDE: Trigger + Breadcrumb -->
    <div class="flex items-center gap-6 flex-1">
      <div
        class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 cursor-pointer transition-all shadow-sm"
        (click)="toggleCollapse()"
        (keydown.enter)="toggleCollapse()"
        tabindex="0"
        role="button"
      >
        <nz-icon
          [nzType]="isCollapsed() ? 'menu-unfold' : 'menu-fold'"
          class="text-lg"
        />
      </div>
      <div class="hidden md:block">
        <nz-breadcrumb [nzSeparator]="iconTemplate">
          <ng-template #iconTemplate>
            <nz-icon nzType="right" class="text-xs text-gray-400" />
          </ng-template>
          <nz-breadcrumb-item>Admin</nz-breadcrumb-item>
          @for (crum of breadcrumbs(); track crum.url; let last = $last) {
            <nz-breadcrumb-item>
              @if (last) {
                <span class="font-semibold text-gray-800">{{
                  crum.label
                }}</span>
              } @else {
                <a
                  [routerLink]="crum.url"
                  class="text-gray-500 hover:text-primary transition-colors"
                  >{{ crum.label }}</a
                >
              }
            </nz-breadcrumb-item>
          }
        </nz-breadcrumb>
      </div>
    </div>

    <!-- RIGHT SIDE: Search - Notify - Profile -->
    <div class="flex items-center gap-4 sm:gap-6">
      <!-- SEARCH BAR FIXED -->
      <div class="hidden lg:flex items-center w-72 h-10 group">
        <div
          class="flex items-center w-full h-full bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-full px-4 transition-all group-focus-within:bg-white group-focus-within:border-indigo-500 group-focus-within:ring-4 group-focus-within:ring-indigo-500/10 shadow-sm"
        >
          <nz-icon
            nzType="search"
            class="text-slate-400 group-focus-within:text-indigo-600 transition-colors text-lg shrink-0"
          />
          <input
            type="text"
            placeholder="Tìm kiếm nhanh..."
            class="w-full h-full bg-transparent border-none outline-none text-sm ml-3 text-slate-700 placeholder-slate-400 p-0 focus:ring-0"
          />
        </div>
      </div>

      <div
        class="relative w-10 h-10 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center cursor-pointer text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 transition-all shadow-sm"
        nz-dropdown
        [nzDropdownMenu]="notifyMenu"
        nzTrigger="click"
        nzPlacement="bottomRight"
      >
        <nz-badge
          [nzCount]="5"
          [nzStyle]="{ backgroundColor: '#3b82f6' }"
          nzSize="small"
        >
          <nz-icon nzType="bell" class="text-xl" />
        </nz-badge>
      </div>

      <nz-dropdown-menu #notifyMenu="nzDropdownMenu">
        <div
          class="bg-white w-80 rounded-xl shadow-xl border border-slate-100 py-2 mt-2"
        >
          <div
            class="px-4 py-2 border-b border-slate-100 font-bold text-slate-700 flex justify-between"
          >
            <span>{{ "Thông báo" | translate }}</span>
            <span class="text-xs text-indigo-600 cursor-pointer">{{
              "Đánh dấu đã đọc" | translate
            }}</span>
          </div>
          <ul class="max-h-64 overflow-y-auto custom-scrollbar">
            <li
              class="px-4 py-3 hover:bg-slate-50 cursor-pointer flex gap-3 items-start border-b border-slate-50"
            >
              <div
                class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0"
              >
                <nz-icon nzType="pay-circle" />
              </div>
              <div>
                <p class="text-sm text-slate-800 font-medium">
                  {{ "Đơn hàng mới #1234" | translate }}
                </p>
                <p class="text-xs text-slate-500 mt-1">
                  {{ "Vừa xong" | translate }}
                </p>
              </div>
            </li>
          </ul>
        </div>
      </nz-dropdown-menu>

      <!-- Divider -->
      <div class="h-8 w-px bg-slate-200 hidden sm:block"></div>

      <app-profile-menu />
    </div>
  </div>
</nz-header>
