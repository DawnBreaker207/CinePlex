<nz-header
  nz-menu
  nzTheme="light"
  style="height: auto"
  class="sticky top-0 z-40 shadow-sm"
>
    <div
      class="w-full bg-[url('/assets/bg-header.png')] bg-repeat-x bg-bottom h-[7.5rem] bg-[#f7f6f4] dark:bg-[#0f1114]"
    >
    <div
      class="max-w-5xl mx-auto flex gap-6 items-center justify-between h-full"
    >
      <!-- LEFT SIDE-->
      <div class="flex items-center gap-6">
        <a
          routerLink="/"
          class="flex items-center gap-2 group cursor-pointer shrink-0"
        >
          <nz-icon
            nzType="shop"
            nzTheme="fill"
            class="text-3xl text-primary group-hover:scale-110 transition-transform"
          />
          <span
            class="text-2xl font-bold tracking-tighter text-gray-900 hidden sm:block"
            >CINE<span class="text-primary">PLEX</span></span
          >
        </a>

        <div class="hidden md:block h-8 w-px bg-gray-300"></div>

        <app-theater-select />
      </div>

      <!-- MIDDLE: Navigation-->
      <div
        class="hidden lg:flex items-center gap-8 font-medium text-gray-600 text-sm xl:text-base"
      >
        @for (header of headers; track header) {
          <a
            class="font-bold hover:text-primary transition-colors py-2"
            [routerLink]="header.path"
            routerLinkActive="text-primary"
          >
            {{ header.name | translate | uppercase }}
          </a>
        }
      </div>

      <!-- RIGHT SIDE -->
      <div class="flex items-center gap-3 h-10 shrink-8">
        <app-auth-menu />
      </div>
    </div>
  </div>
</nz-header>
