<a href="#main-content" class="skip-link">
  {{ "common.skipToContent" | translate }}
</a>
<nz-layout data-theme="client">
  <app-header />
  <nz-content id="main-content">
    <div class="relative">
      <app-loading [isLoading]="loading()">
        <router-outlet />
      </app-loading>
      @if (!loading()) {
        <nz-float-button-top />
      }
    </div>
  </nz-content>
  <app-footer />
</nz-layout>
