<a href="#main-content" class="skip-link">
  {{ "common.skipToContent" | translate }}
</a>
<nz-layout data-theme="client">
  <app-header />
  <nz-content id="main-content">
    <div class="relative">
      @if (loading()) {
        <app-loading>
          <router-outlet />
        </app-loading>
      } @else {
        <router-outlet />
        <nz-float-button-top />
      }
    </div>
  </nz-content>
  <app-footer />
</nz-layout>
