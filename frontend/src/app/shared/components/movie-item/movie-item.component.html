<article
  class="h-full overflow-hidden rounded-xl border border-slate-200 dark:border-gray-700 bg-white dark:bg-[#161a20]"
>
  <a
    [routerLink]="['/movie/detail', movie().id]"
    class="block h-40 bg-slate-100 dark:bg-gray-800"
    [attr.aria-label]="movie().title"
  >
    <img
      [src]="
        movie().backdrop ||
        movie().poster ||
        'https://placehold.co/300x400/1A202C/F8FAFC?text=CinePlex'
      "
      [alt]="movie().title"
      loading="lazy"
      class="h-full w-full object-cover"
    />
  </a>
  <div class="space-y-2 p-3">
    <div class="flex items-start justify-between gap-2">
      <a
        [routerLink]="['/movie/detail', movie().id]"
        class="block truncate text-sm font-semibold text-slate-900 dark:text-gray-100 hover:text-primary"
        [title]="movie().title"
      >
        {{ movie().title }}
      </a>
      <button
        nz-button
        nzType="text"
        nzShape="circle"
        class="shrink-0 min-w-11 min-h-11 flex items-center justify-center"
        [attr.aria-label]="'favorites.toggle' | translate"
        [attr.aria-pressed]="favorites.isFavorite(movie().id)"
        nz-tooltip
        [nzTooltipTitle]="
          favorites.isFavorite(movie().id)
            ? ('favorites.remove' | translate)
            : ('favorites.toggle' | translate)
        "
        (click)="toggleFavorite()"
      >
        <nz-icon
          nzType="heart"
          [nzTheme]="favorites.isFavorite(movie().id) ? 'fill' : 'outline'"
          [class.text-primary]="favorites.isFavorite(movie().id)"
          class="text-base"
          aria-hidden="true"
        />
      </button>
    </div>
    <p
      class="truncate text-xs text-slate-500 dark:text-gray-400"
      [title]="movie().genres.join(', ')"
    >
      @if (movie().rating !== undefined && movie().rating !== null) {
        <span class="font-mono font-semibold text-warning tabular-nums"
          >★ {{ movie().rating }}</span
        >
        ·
      }
      {{
        movie().genres.join(", ") ||
          ("movie.genreUpdating" | translate)
      }}
    </p>
    <button
      nz-button
      nzBlock
      nzType="primary"
      class="rounded-lg min-h-11"
      (click)="onSelectMovie(movie().id)"
    >
      {{ "common.bookTicket" | translate }}
    </button>
  </div>
</article>
