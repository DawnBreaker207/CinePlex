<article
  class="h-full overflow-hidden rounded-xl border border-slate-200 bg-white"
>
  <a
    [routerLink]="['/movie/detail', movie().id]"
    class="block h-40 bg-slate-100"
  >
    <img
      [src]="
        movie().backdrop ||
        movie().poster ||
        'https://placehold.co/300x400/DBEAFE/1F2937?text=Soon'
      "
      [alt]="movie().title"
      class="h-full w-full object-cover"
    />
  </a>
  <div class="space-y-2 p-3">
    <div class="flex items-start justify-between gap-2">
      <a
        [routerLink]="['/movie/detail', movie().id]"
        class="block truncate text-sm font-semibold text-slate-900 hover:text-[var(--color-primary)]"
        [title]="movie().title"
      >
        {{ movie().title }}
      </a>
      <button
        nz-button
        nzType="text"
        nzShape="circle"
        class="shrink-0 !p-1"
        [attr.aria-label]="'favorites.toggle' | translate"
        [attr.aria-pressed]="favorites.isFavorite(movie().id)"
        (click)="toggleFavorite()"
      >
        <nz-icon
          nzType="heart"
          [nzTheme]="favorites.isFavorite(movie().id) ? 'fill' : 'outline'"
          [class.text-primary]="favorites.isFavorite(movie().id)"
          class="text-base"
        />
      </button>
    </div>
    <p
      class="truncate text-xs text-slate-500"
      [title]="movie().genres.join(', ')"
    >
      {{
        movie().genres.join(", ") ||
          ("movie.genreUpdating" | translate)
      }}
    </p>
    <button
      nz-button
      nzBlock
      nzType="primary"
      class="rounded-lg border-none bg-[var(--color-primary)] text-white hover:bg-[#C53030]"
      (click)="onSelectMovie(movie().id)"
    >
      {{ "common.bookTicket" | translate }}
    </button>
  </div>
</article>
