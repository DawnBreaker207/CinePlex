
<div
  class="relative flex flex-col overflow-hidden rounded-2xl border border-white/15 bg-gradient-to-br from-[#1e232d] via-[#161a20] to-[#111418] shadow-2xl sm:flex-row text-gray-100"
>
  <!-- Stub (Barcode & Code) -->
  <div class="flex items-center justify-between gap-4 p-5 sm:w-44 sm:flex-col sm:justify-center bg-black/30 border-b sm:border-b-0 sm:border-r border-white/10 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gold/20 flex items-center justify-center text-gold">
        <nz-icon nzType="video-camera" nzTheme="fill" aria-hidden="true" />
      </div>
      <span class="text-xs font-black tracking-widest uppercase text-gold">
        E-TICKET
      </span>
    </div>
    <div class="flex flex-col items-end gap-1.5 sm:items-center">
      <div class="p-2 bg-white rounded-xl shadow-inner">
        <app-barcode [value]="code()" />
      </div>
      <span class="font-mono text-xs font-bold tracking-widest text-primary">
        {{ code() }}
      </span>
    </div>
  </div>

  <!-- Perforation (Tactile Cutting Notch) -->
  <div class="relative flex items-center px-4 sm:flex-col sm:px-0 sm:py-4">
    <div class="h-full w-px border-l-2 border-dashed border-white/20 sm:h-px sm:w-full sm:border-l-0 sm:border-t-2"></div>
    <div class="absolute left-1/2 top-1/2 h-5 w-5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#0b0d10] border border-white/10 sm:left-0 sm:top-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2"></div>
    <div class="absolute left-1/2 top-1/2 h-5 w-5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#0b0d10] border border-white/10 sm:left-auto sm:right-0 sm:top-1/2 sm:translate-x-1/2 sm:-translate-y-1/2"></div>
  </div>

  <!-- Main Ticket Body -->
  <div class="flex flex-1 flex-col justify-between gap-5 p-5">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider bg-primary text-white">
          2D DIGITAL
        </span>
      </div>
      <h3 class="line-clamp-1 text-xl font-black text-white m-0">
        {{ title() }}
      </h3>
      <p class="mt-1 text-xs text-gray-400 font-medium m-0 flex items-center gap-1.5">
        <nz-icon nzType="environment" nzTheme="fill" class="text-primary" />
        {{ subtitle() }}
      </p>
    </div>

    <div class="grid grid-cols-2 gap-x-4 gap-y-3 bg-white/5 p-3.5 rounded-xl border border-white/5">
      @for (row of meta(); track row.label) {
        <div>
          <p class="text-[10px] font-black uppercase tracking-wider text-gray-400 m-0 mb-0.5">
            {{ row.label }}
          </p>
          <p
            class="font-mono text-sm font-bold m-0"
            [class.text-primary]="row.accent"
            [class.text-white]="!row.accent"
          >
            {{ row.value }}
          </p>
        </div>
      }
    </div>

    @if (amount(); as amount) {
      <div class="flex items-center justify-between border-t border-white/10 pt-3">
        <span class="text-xs uppercase font-extrabold tracking-wider text-gray-400">
          {{ 'common.total' | translate }}
        </span>
        <span class="font-mono text-lg font-black text-primary tabular-nums">
          {{ amount }}
        </span>
      </div>
    }
  </div>
</div>
