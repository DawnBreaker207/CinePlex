
    <div
      class="relative flex flex-col overflow-hidden rounded-2xl border border-border bg-white sm:flex-row"
    >
      <!-- Stub -->
      <div class="flex items-center justify-between gap-3 p-4 sm:w-40 sm:flex-col sm:justify-center">
        <div class="flex items-center gap-2">
          <nz-icon nzType="trophy" class="text-xl text-gold" />
          <span class="text-lg font-semibold uppercase leading-none tracking-wide text-slate-900">
            {{ title() }}
          </span>
        </div>
        <div class="flex flex-col items-end gap-1 sm:items-center">
          <app-barcode [value]="code()" />
          <span class="font-mono text-[10px] tracking-widest text-muted">
            {{ code() }}
          </span>
        </div>
      </div>

      <!-- Perforation -->
      <div class="relative flex items-center px-3 sm:flex-col sm:px-0 sm:py-3">
        <div class="h-full w-px border-l-2 border-dashed border-border sm:h-px sm:w-full sm:border-l-0 sm:border-t-2"></div>
        <div class="absolute left-1/2 top-1/2 h-4 w-4 -translate-x-1/2 -translate-y-1/2 rounded-full border border-border bg-bg sm:-translate-x-0 sm:translate-y-0 sm:left-0 sm:top-1/2 sm:-translate-y-1/2 sm:-translate-x-1/2"></div>
        <div class="absolute left-1/2 top-1/2 h-4 w-4 -translate-x-1/2 -translate-y-1/2 rounded-full border border-border bg-bg sm:left-auto sm:right-0 sm:top-1/2 sm:-translate-x-0 sm:translate-y-1/2 sm:-translate-y-1/2 sm:translate-x-1/2"></div>
      </div>

      <!-- Main -->
      <div class="flex flex-1 flex-col justify-between gap-4 p-4">
        <div>
          <h3 class="line-clamp-1 text-xl font-semibold uppercase leading-tight tracking-wide text-slate-900">
            {{ title() }}
          </h3>
          <p class="mt-0.5 text-sm text-muted">{{ subtitle() }}</p>
        </div>

        <div class="grid grid-cols-2 gap-x-4 gap-y-2">
          @for (row of meta(); track row.label) {
            <div>
              <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">
                {{ row.label }}
              </p>
              <p
                class="font-mono text-sm"
                [class.text-primary]="row.accent"
                [class.text-slate-900]="!row.accent"
              >
                {{ row.value }}
              </p>
            </div>
          }
        </div>

        @if (amount(); as amount) {
          <div class="flex items-center justify-between border-t border-border pt-3">
            <span class="text-sm text-muted">{{ 'common.total' | translate }}</span>
            <span class="font-mono text-lg font-semibold text-primary">{{ amount }}</span>
          </div>
        }
      </div>
    </div>
