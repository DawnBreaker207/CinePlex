<div
  class="bg-white dark:bg-[#161a20] p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700"
>
  <div class="flex justify-between items-center mb-4">
    <h4
      class="text-base font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2"
    >
      <nz-icon
        nzType="pie-chart"
        nzTheme="fill"
        class="text-primary"
        aria-hidden="true"
      />
      {{ "admin.dashboard.paymentDistribution" | translate }}
    </h4>
  </div>
  @if (payments().length === 0) {
    <div
      class="h-[250px] sm:h-[350px] flex flex-col items-center justify-center gap-2 text-gray-400 dark:text-gray-500"
    >
      <nz-icon nzType="pie-chart" nzTheme="outline" class="text-4xl" aria-hidden="true" />
      <span class="text-sm">{{ "common.noData" | translate }}</span>
    </div>
  } @else {
    <div
      echarts
      [options]="options()"
      class="w-full h-[250px] sm:h-[350px]"
    ></div>
  }
</div>
