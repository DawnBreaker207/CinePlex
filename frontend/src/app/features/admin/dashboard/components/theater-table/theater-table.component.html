<div class="overflow-x-auto">
  <nz-table nzTemplateMode class="w-full min-w-[300px]">
    <thead>
      <th>{{ "common.movies" | translate }}</th>
      <th>{{ "admin.dashboard.ticketCount" | translate }}</th>
      <th>{{ "admin.dashboard.revenue" | translate }}</th>
    </thead>
    <tbody>
      @for (item of data(); track item) {
        <tr>
          <td>{{ item.movieName }}</td>
          <td>{{ item.ticketSold }}</td>
          <td>{{ item.revenue | currencyFormat }}</td>
        </tr>
      } @empty {
        <tr>
          <td
            colspan="3"
            class="text-center text-gray-500 dark:text-gray-400 py-8"
          >
            {{ "common.noData" | translate }}
          </td>
        </tr>
      }
    </tbody>
  </nz-table>
</div>
