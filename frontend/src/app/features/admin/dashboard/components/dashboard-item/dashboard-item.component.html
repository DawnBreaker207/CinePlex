<div
  class="bg-white dark:bg-[#1a202c] p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-md transition-shadow"
>
  <div class="flex justify-between items-start">
    <div>
      <p class="text-gray-600 dark:text-gray-400 text-sm font-medium">{{ title() }}</p>
      <h3 class="text-2xl font-bold mt-1 text-gray-800 dark:text-gray-100">
        {{ value() }}
      </h3>
    </div>
    <div
      class="p-2.5 rounded-full bg-primary-light text-primary flex items-center justify-center"
    >
      <i-lucide [name]="icon()" class="text-xl" aria-hidden="true"></i-lucide>
    </div>
  </div>
</div>
