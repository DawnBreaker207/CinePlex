<div
  class="bg-white dark:bg-[#1a202c] p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-md transition-shadow"
>
  <div class="flex justify-between items-start">
    <div>
      <p class="text-gray-600 dark:text-gray-400 text-sm font-medium">{{ title() }}</p>
      <h3 class="text-2xl font-bold mt-1 text-gray-800 dark:text-gray-100">
        {{ value() }}
      </h3>
      @if (trend() !== null) {
        <div class="mt-2 flex items-center gap-2">
          <span
            class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-semibold"
            [class]="
              (trend() ?? 0) >= 0
                ? 'bg-success/10 text-success'
                : 'bg-danger/10 text-danger'
            "
          >
            <nz-icon
              [nzType]="(trend() ?? 0) >= 0 ? 'arrow-up' : 'arrow-down'"
              aria-hidden="true"
            />
            {{ (trend() ?? 0) >= 0 ? '+' : '' }}{{ trend()!.toFixed(1) }}%
          </span>
          <span class="text-xs text-gray-400 dark:text-gray-500">{{
            "admin.dashboard.vsPrevious" | translate
          }}</span>
        </div>
      }
    </div>
    <div
      class="p-2.5 rounded-full bg-primary-light text-primary flex items-center justify-center"
    >
      <i-lucide [name]="icon()" class="text-xl" aria-hidden="true"></i-lucide>
    </div>
  </div>
</div>
