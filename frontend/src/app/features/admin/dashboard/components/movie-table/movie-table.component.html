<div class="overflow-x-auto">
  <nz-table nzTemplateMode class="w-full min-w-[300px]">
    <thead>
      <th>{{ "Rạp" | translate }}</th>
      <th>{{ "Vé" | translate }}</th>
      <th>{{ "Doanh thu" | translate }}</th>
    </thead>
    <tbody>
      @for (item of data(); track item) {
        <tr>
          <td>{{ item.theaterName }}</td>
          <td>{{ item.ticketsSold }}</td>
          <td>{{ item.totalRevenue | currencyFormat }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="text-center text-gray-500 dark:text-gray-400 py-8">
            {{ "Chưa có dữ liệu" | translate }}
          </td>
        </tr>
      }
    </tbody>
  </nz-table>
</div>
