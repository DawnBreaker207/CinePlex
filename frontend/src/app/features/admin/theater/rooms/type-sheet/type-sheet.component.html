<div class="flex flex-col gap-2 pb-4">
  <p class="px-1 text-sm font-semibold text-gray-500">
    {{ 'admin.room.setType' | translate }}
  </p>
  @for (entry of types; track entry.type) {
    <button
      type="button"
      class="flex h-14 w-full items-center gap-3 rounded-xl border border-gray-200 px-4 text-left text-base font-medium active:bg-gray-100 dark:border-gray-700 dark:active:bg-gray-800"
      (click)="pick(entry.type)"
    >
      <span class="h-5 w-5 shrink-0 rounded" [class]="entry.swatch"></span>
      {{ 'admin.room.type.' + entry.type | translate }}
    </button>
  }
  @if (coupleAllowed) {
    <button
      type="button"
      class="flex h-14 w-full items-center gap-3 rounded-xl border border-gray-200 px-4 text-left text-base font-medium active:bg-gray-100 dark:border-gray-700 dark:active:bg-gray-800"
      (click)="pick(coupleEntry.type)"
    >
      <span class="h-5 w-5 shrink-0 rounded" [class]="coupleEntry.swatch"></span>
      {{ 'admin.room.type.' + coupleEntry.type | translate }}
    </button>
  }
</div>
