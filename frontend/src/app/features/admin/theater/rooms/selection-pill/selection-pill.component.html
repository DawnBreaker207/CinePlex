<div
  class="z-30 flex items-center gap-2 rounded-full border border-gray-200 bg-white px-3 py-1.5 shadow-lg transition-[box-shadow,background-color,border-color] duration-150 dark:border-gray-600 dark:bg-gray-800"
  [class.absolute]="!docked()"
  [style.top.px]="!docked() ? top() : null"
  [style.left]="docked() ? '50%' : left() + 'px'"
  [style.transform]="docked() ? 'translateX(-50%)' : null"
  [style.position]="docked() ? 'fixed' : null"
  [style.bottom]="docked() ? '1rem' : null"
  [class.opacity-0]="dimmed()"
  [class.scale-95]="dimmed()"
  [class.pointer-events-none]="dimmed()"
>
  <span class="flex h-5 min-w-5 items-center justify-center rounded-full bg-gray-900 px-1 text-xs font-bold text-white dark:bg-white dark:text-gray-900">
    {{ count() }}
  </span>
  <span
    [nzTooltipTitle]="coupleDisabled() ? coupleHint() : typeHint()"
    nzTooltipPlacement="top"
    nz-tooltip
  >
    <button
      type="button"
      class="flex h-10 w-10 items-center justify-center rounded-full transition-colors hover:bg-gray-100 disabled:opacity-30 dark:hover:bg-gray-700"
      [disabled]="coupleDisabled()"
      [attr.aria-label]="typeHint()"
      (click)="toggleList.emit()"
    >
      <nz-icon nzType="bg-colors" />
    </button>
  </span>
  <button
    type="button"
    class="flex h-10 w-10 items-center justify-center rounded-full transition-colors hover:bg-gray-100 hover:text-danger dark:hover:bg-gray-700"
    [attr.aria-label]="'admin.room.deleteSelected' | translate"
    nz-tooltip
    [nzTooltipTitle]="'admin.room.deleteSelected' | translate"
    nz-popconfirm
    [nzPopconfirmTitle]="deleteTitle()"
    (nzOnConfirm)="requestDelete.emit()"
  >
    <nz-icon nzType="delete" />
  </button>
  <button
    type="button"
    class="flex h-10 w-10 items-center justify-center rounded-full transition-colors hover:bg-gray-100 dark:hover:bg-gray-700"
    [attr.aria-label]="'admin.room.clearSelection' | translate"
    nz-tooltip
    [nzTooltipTitle]="'admin.room.clearSelection' | translate"
    (click)="requestClear.emit()"
  >
    <nz-icon nzType="close" />
  </button>
  @if (listOpen()) {
    <div class="absolute top-full right-0 z-40 mt-1 w-40 overflow-hidden rounded-lg border border-gray-200 bg-white py-1 shadow-xl dark:border-gray-600 dark:bg-gray-800">
      <button
        type="button"
        class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm hover:bg-gray-100 dark:hover:bg-gray-700"
        (click)="pickType.emit('NORMAL')"
      >
        <span class="h-3 w-3 rounded bg-slate-300"></span>
        {{ "admin.room.type.NORMAL" | translate }}
      </button>
      <button
        type="button"
        class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm hover:bg-gray-100 dark:hover:bg-gray-700"
        (click)="pickType.emit('VIP')"
      >
        <span class="h-3 w-3 rounded bg-[var(--color-gold)]"></span>
        {{ "admin.room.type.VIP" | translate }}
      </button>
      <button
        type="button"
        class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm hover:bg-gray-100 disabled:opacity-40 dark:hover:bg-gray-700"
        [disabled]="!coupleAllowed()"
        [title]="pairHint()"
        (click)="pickType.emit('COUPLE')"
      >
        <span class="h-3 w-3 rounded bg-purple-500"></span>
        {{ "admin.room.type.COUPLE" | translate }}
      </button>
    </div>
  }
</div>
