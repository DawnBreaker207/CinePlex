@if (guideOn()) {
  <nz-alert
    nzType="info"
    nzShowIcon
    nzCloseable
    (nzOnClose)="dismissGuide.emit()"
    class="mb-4"
    [nzMessage]="'admin.room.guideTitle' | translate"
    [nzDescription]="guideTpl"
  />
  <ng-template #guideTpl>
    <ul class="list-disc space-y-1 pl-5 text-sm">
      <li>{{ "admin.room.guideStep1" | translate }}</li>
      <li>{{ "admin.room.guideStep2" | translate }}</li>
      <li>{{ "admin.room.guideStep3" | translate }}</li>
    </ul>
  </ng-template>
}

@if (tourIndex() >= 0) {
  <div
    class="fixed bottom-4 left-1/2 z-40 w-[calc(100vw-2rem)] max-w-sm -translate-x-1/2 rounded-xl border border-gray-200 bg-white p-4 shadow-xl dark:border-gray-600 dark:bg-gray-800"
    role="dialog"
    [attr.aria-label]="'admin.room.guideTitle' | translate"
  >
    <div class="mb-1 flex items-center justify-between gap-2">
      <span class="text-xs font-bold uppercase tracking-wider text-gray-400">
        {{ tourIndex() + 1 }} / 3
      </span>
      <button
        type="button"
        class="text-xs font-medium text-gray-500 hover:text-primary"
        (click)="skipTour.emit()"
      >
        {{ "admin.room.tourSkip" | translate }}
      </button>
    </div>
    <p class="mb-3 text-sm">{{ ('admin.room.tourStep' + (tourIndex() + 1)) | translate }}</p>
    <div class="flex justify-end">
      <button nz-button nzType="primary" nzSize="small" (click)="nextTourStep.emit()">
        {{ tourIndex() === 2 ? ("common.save" | translate) : ("admin.room.tourNext" | translate) }}
      </button>
    </div>
  </div>
}
