<form
  nz-form
  [formGroup]="form"
  (ngSubmit)="submit()"
  nzLayout="vertical"
  class="flex-1 overflow-y-auto p-4 pb-24 space-y-6"
>
  <!-- TITLE/SLUG -->
  <nz-form-item>
    <nz-form-label [nzSpan]="24" nzRequired
      >{{ "admin.article.form.title" | translate }}
    </nz-form-label>
    <nz-form-control
      [nzErrorTip]="'admin.article.form.titleRequired' | translate"
    >
      <input
        nz-input
        formControlName="title"
        [placeholder]="'admin.article.form.titlePlaceholder' | translate"
        maxlength="255"
      />
    </nz-form-control>
  </nz-form-item>

  <!-- THUMBNAIL & SUMMARY -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Upload giả lập (Input URL) -->
    <nz-form-item>
      <nz-form-label nzRequired
        >{{ "admin.article.imageUrl" | translate }}
      </nz-form-label>
      <nz-form-control>
        <input
          nz-input
          formControlName="thumbnail"
          [placeholder]="'admin.article.imagePlaceholder' | translate"
          maxlength="500"
        />
        @if (form.get("thumbnail")?.value) {
          <img
            [src]="form.get('thumbnail')?.value"
            [alt]="form.get('title')?.value"
            loading="lazy"
            class="h-32 w-full object-cover rounded-lg border border-gray-600"
          />
        }
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzRequired
        >{{ "admin.article.form.summary" | translate }}
      </nz-form-label>
      <nz-form-control>
        <textarea
          nz-input
          formControlName="summary"
          rows="5"
          [placeholder]="'admin.article.form.summaryPlaceholder' | translate"
          maxlength="500"
        ></textarea>
      </nz-form-control>
    </nz-form-item>
  </div>

  <!-- QUILL EDITOR -->
  <nz-form-item>
    <nz-form-label nzRequired>{{
      "admin.article.form.content" | translate
    }}</nz-form-label>
    <nz-form-control [nzSpan]="24">
      <quill-editor
        formControlName="content"
        [modules]="quillConfig"
        [styles]="{
          height: '25rem',
          backgroundColor: 'f0f0f0',
          color: 'black',
        }"
        class="block-lg"
      ></quill-editor>
    </nz-form-control>
  </nz-form-item>

  <!-- TYPE & STATUS -->
  <div class="grid grid-cols-2 gap-6">
    <nz-form-item>
      <nz-form-label>{{ "common.category" | translate }}</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="type">
          <nz-option
            [nzValue]="ArticleType.UNKNOWN"
            [nzLabel]="'common.unknown' | translate"
          ></nz-option>
          <nz-option
            [nzValue]="ArticleType.NEWS"
            [nzLabel]="'admin.article.category.news' | translate"
          ></nz-option>
          <nz-option
            [nzValue]="ArticleType.PROMOTION"
            [nzLabel]="'admin.article.category.promo' | translate"
          ></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label>{{ "common.status" | translate }} </nz-form-label>
      <nz-form-control>
        <nz-select formControlName="status">
          <nz-option
            [nzValue]="ArticleStatus.DRAFT"
            [nzLabel]="'admin.article.category.draft' | translate"
          ></nz-option>
          <nz-option
            [nzValue]="ArticleStatus.PUBLISHED"
            [nzLabel]="'admin.article.category.published' | translate"
          ></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  </div>

  <!-- FOOTER -->
  <div
    class="absolute bottom-0 left-0 w-full bg-white dark:bg-[#1a202c] border-t border-gray-200 dark:border-gray-700 p-4 flex justify-end gap-3 z-50 shadow-md"
  >
    <button nz-button nzType="default" (click)="close()">
      {{ "common.cancel" | translate }}
    </button>
    <button
      nz-button
      nzType="primary"
      [nzLoading]="isLoading()"
      [disabled]="form.invalid"
      (click)="submit()"
    >
      {{
        (nzData.isEditMode ? "article.form.update" : "article.form.publish")
          | translate
      }}
    </button>
  </div>
</form>
