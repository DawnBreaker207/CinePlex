<div class="rounded-xl border border-gray-200 bg-white p-6">
  <h2 class="text-lg font-bold text-gray-900">
    {{ "reservation.stepCombo" | translate }}
  </h2>
  <p class="mt-1 text-sm text-gray-500">
    {{ "reservation.comboHint" | translate }}
  </p>
  <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-3">
    @for (combo of combos; track combo.name) {
      <div class="rounded-xl border border-gray-200 p-4 text-center">
        <nz-icon nzType="shopping" class="text-2xl text-primary" />
        <p class="mt-2 font-bold text-gray-900">{{ combo.name }}</p>
        <p class="text-xs text-gray-500">{{ combo.desc }}</p>
        <p class="mt-1 font-bold text-primary">
          {{ combo.price | currency: "VND" }}
        </p>
      </div>
    }
  </div>
  <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-end">
    <button nz-button nzType="text" (click)="goNext()">
      {{ "reservation.comboSkip" | translate }}
    </button>
    <button nz-button nzType="primary" (click)="goNext()">
      {{ "reservation.comboContinue" | translate }}
      <nz-icon nzType="arrow-right" />
    </button>
  </div>
</div>
