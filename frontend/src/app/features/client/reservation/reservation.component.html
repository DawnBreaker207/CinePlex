<nz-layout class="min-h-screen bg-transparent">
  <!-- HEADER STEPS (GLASS NAV) -->
  <div
    class="glass-header px-0 h-auto sticky top-0 z-40 shadow-2xl"
  >
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
      <nz-steps nzType="navigation" nzSize="small" [nzCurrent]="index()" class="cinema-steps">
        <nz-step [nzTitle]="'reservation.stepSeat' | translate" nzIcon="table"></nz-step>
        <nz-step [nzTitle]="'reservation.stepCombo' | translate" nzIcon="shopping"></nz-step>
        <nz-step [nzTitle]="'reservation.stepConfirm' | translate" nzIcon="solution"></nz-step>
      </nz-steps>
    </div>
  </div>

  <!-- BODY CONTENT -->
  <nz-content class="py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto">
      <!-- MAIN GRID (LEFT CONTENT + RIGHT SUMMARY SIDEBAR) -->
      <div class="flex flex-col lg:flex-row gap-8 items-start">
        <!-- LEFT WORKSPACE -->
        <div class="flex-1 min-w-0 w-full">
          <div
            class="glass-panel rounded-2xl p-6 sm:p-8 border border-white/10 shadow-2xl min-h-full"
          >
            @switch (index()) {
              @case (0) {
                @if (seatStore.selectedSeats()) {
                  <app-seat />
                }
              }
              @case (1) {
                <app-combo
                  (changed)="combos.set($event)"
                  (next)="onComboNext()"
                />
              }
              @case (2) {
                <app-confirm [combos]="combos()" />
              }
            }
          </div>
        </div>

        <!-- RIGHT SIDEBAR: TICKET SUMMARY (380px) -->
        <aside class="w-full lg:w-[380px] shrink-0 sticky top-28">
          <app-detail-film
            [index]="index()"
            [steps]="steps()"
            [holdingSeats]="reservationStore.holdingSeats()"
            [paymentLoading]="reservationStore.submittingPayment()"
            (stepChange)="onStepChange($event)"
            (confirm)="onConfirm()"
            (pay)="onPay()"
          />
        </aside>
      </div>
    </div>
  </nz-content>

  <!-- MOBILE BOTTOM BAR -->
  <div
    class="lg:hidden sticky bottom-0 z-50 glass-header border-t border-white/10 px-4 py-3 shadow-2xl"
  >
    <div class="flex items-center justify-between gap-3">
      <div>
        <p class="text-xs text-gray-400 m-0">{{ "reservation.total" | translate }}</p>
        <p class="text-xl font-black font-mono tabular-nums text-primary m-0">
          {{ seatStore.totalPrice() | currency: "VND" }}
        </p>
      </div>
      @if (index() === 0) {
        <button
          nz-button
          nzType="primary"
          class="h-11 px-6 rounded-xl font-bold uppercase tracking-wider text-xs bg-primary hover:bg-primary-dark border-none shadow-lg marquee-glow-subtle cursor-pointer"
          [disabled]="seatStore.selectSeatsCount() === 0 || reservationStore.holdingSeats()"
          [nzLoading]="reservationStore.holdingSeats()"
          (click)="onConfirm()"
        >
          {{ "reservation.holdSeat" | translate }}
        </button>
      } @else if (index() === 1) {
        <button
          nz-button
          nzType="primary"
          class="h-11 px-6 rounded-xl font-bold uppercase tracking-wider text-xs bg-primary hover:bg-primary-dark border-none shadow-lg marquee-glow-subtle cursor-pointer"
          (click)="onComboNext()"
        >
          {{ "reservation.comboContinue" | translate }}
        </button>
      } @else {
        <button
          nz-button
          nzType="primary"
          class="h-11 px-6 rounded-xl font-bold uppercase tracking-wider text-xs bg-primary hover:bg-primary-dark border-none shadow-lg marquee-glow-subtle cursor-pointer"
          [disabled]="reservationStore.submittingPayment()"
          [nzLoading]="reservationStore.submittingPayment()"
          (click)="onPay()"
        >
          {{ "reservation.payNow" | translate }}
        </button>
      }
    </div>
  </div>
</nz-layout>
