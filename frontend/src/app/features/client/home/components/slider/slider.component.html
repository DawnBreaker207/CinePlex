<div class="w-full bg-black bg-[url('/assets/bg-slider.png')] bg-repeat bg-center py-6">
  <div
    class="mx-auto w-full max-w-5xl overflow-hidden rounded-xl border border-slate-700 bg-black shadow-2xl"
  >
    <nz-carousel
      [nzAutoPlay]="autoPlay()"
      nzEffect="fade"
      [nzAutoPlaySpeed]="5000"
      [nzEnableSwipe]="true"
      class="block w-full"
    >
      @for (banner of banners; track banner.id) {
        <div nz-carousel-content>
          <div class="relative h-[420px] w-full md:h-[500px]">
            <img
              [src]="banner.image"
              [alt]="banner.title"
              loading="lazy"
              class="absolute inset-0 h-full w-full object-cover pointer-events-none"
            />

            <div
              class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black via-black/75 to-black/15 opacity-100"
            ></div>

            <div
              class="absolute inset-0 flex flex-col justify-end p-6 md:p-10 lg:p-14"
            >
              <div class="max-w-3xl">
                <h1
                  class="mb-3 text-3xl font-extrabold leading-tight text-white md:text-5xl"
                >
                  {{ banner.title }}
                </h1>

                <p
                  class="mb-6 max-w-2xl line-clamp-2 text-sm text-white/95 md:text-base"
                >
                  {{ banner.desc }}
                </p>

                <div class="flex flex-wrap items-center gap-3">
                  @if (banner.movieId != null) {
                    <button
                      nz-button
                      nzType="primary"
                      (click)="book(banner)"
                      class="flex min-h-11 items-center gap-2 rounded-lg border-none bg-primary px-5 text-sm font-semibold text-white"
                    >
                      <nz-icon nzType="barcode" aria-hidden="true" />
                      {{ "detail.bookNow" | translate }}
                    </button>
                  }
                  <button
                    nz-button
                    nzType="default"
                    (click)="soon()"
                    class="flex min-h-11 items-center gap-2 rounded-lg border border-slate-200/70 bg-transparent px-5 text-sm font-semibold text-white hover:border-primary hover:text-primary"
                  >
                    <nz-icon nzType="play-circle" aria-hidden="true" />
                    {{ "detail.watchTrailerLower" | translate }}
                  </button>
                  <button
                    type="button"
                    (click)="autoPlay.set(!autoPlay())"
                    [attr.aria-label]="'slider.toggleAutoplay' | translate"
                    [attr.aria-pressed]="autoPlay()"
                    class="flex min-h-11 min-w-11 items-center justify-center rounded-lg border border-slate-200/70 bg-transparent text-sm font-semibold text-white"
                  >
                    <nz-icon
                      [nzType]="autoPlay() ? 'pause' : 'caret-right'"
                      aria-hidden="true"
                    />
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      }
    </nz-carousel>
  </div>
</div>
