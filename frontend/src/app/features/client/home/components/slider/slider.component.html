<div class="relative w-full overflow-hidden bg-[#0b0d10]">
  <nz-carousel
    [nzAutoPlay]="autoPlay()"
    nzEffect="fade"
    [nzAutoPlaySpeed]="6000"
    [nzEnableSwipe]="true"
    class="block w-full cinema-hero-carousel"
  >
    @for (banner of banners; track banner.id) {
      <div nz-carousel-content>
        <div class="relative h-[480px] sm:h-[560px] lg:h-[620px] w-full overflow-hidden">
          <!-- BACKDROP POSTER -->
          <img
            [src]="banner.image"
            [alt]="banner.title"
            loading="lazy"
            class="absolute inset-0 h-full w-full object-cover object-center pointer-events-none scale-105 transition-transform duration-1000"
          />

          <!-- CINEMATIC VIGNETTE & GRADIENT MASKS -->
          <div
            class="pointer-events-none absolute inset-0 bg-gradient-to-t from-[#0b0d10] via-[#0b0d10]/60 to-black/40"
          ></div>
          <div
            class="pointer-events-none absolute inset-0 bg-gradient-to-r from-[#0b0d10] via-[#0b0d10]/70 to-transparent sm:w-3/4"
          ></div>

          <!-- HERO CONTENT CONTAINER -->
          <div
            class="relative z-10 mx-auto flex h-full max-w-7xl flex-col justify-end px-4 pb-16 pt-24 sm:px-6 lg:px-8"
          >
            <div class="max-w-2xl space-y-4">
              <!-- CINEMA BADGE & GENRE -->
              <div class="flex items-center gap-2.5">
                <span class="px-2.5 py-1 rounded-md text-xs font-black uppercase tracking-wider bg-primary text-white shadow-md">
                  IMAX 2D
                </span>
                <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-white/10 backdrop-blur-md border border-white/10 text-gray-200">
                  Phim Bom Tấn
                </span>
              </div>

              <!-- MOVIE TITLE -->
              <h1
                class="text-3xl sm:text-5xl lg:text-6xl font-black leading-tight text-white tracking-tight drop-shadow-2xl m-0 line-clamp-2"
              >
                {{ banner.title }}
              </h1>

              <!-- OVERVIEW -->
              <p
                class="max-w-xl text-xs sm:text-sm md:text-base text-gray-300 line-clamp-3 leading-relaxed drop-shadow m-0"
              >
                {{ banner.desc }}
              </p>

              <!-- ACTION BUTTONS -->
              <div class="flex flex-wrap items-center gap-3.5 pt-2">
                @if (banner.movieId != null) {
                  <button
                    nz-button
                    nzType="primary"
                    (click)="book(banner)"
                    class="h-12 px-7 rounded-xl font-bold uppercase tracking-wider text-xs bg-primary hover:bg-primary-dark border-none shadow-xl marquee-glow flex items-center gap-2.5 cursor-pointer transition-all duration-300"
                  >
                    <nz-icon nzType="thunderbolt" nzTheme="fill" class="text-base" />
                    <span>{{ "detail.bookNow" | translate }}</span>
                  </button>
                }
                <button
                  nz-button
                  nzType="default"
                  (click)="soon()"
                  class="h-12 px-6 rounded-xl font-bold uppercase tracking-wider text-xs bg-white/10 hover:bg-white/20 text-white border border-white/20 backdrop-blur-md flex items-center gap-2 cursor-pointer transition-all duration-300"
                >
                  <nz-icon nzType="play-circle" nzTheme="fill" class="text-base text-primary" />
                  <span>{{ "detail.watchTrailerLower" | translate }}</span>
                </button>
                <button
                  type="button"
                  (click)="autoPlay.set(!autoPlay())"
                  [attr.aria-label]="'slider.toggleAutoplay' | translate"
                  [attr.aria-pressed]="autoPlay()"
                  class="w-12 h-12 rounded-xl bg-white/5 hover:bg-white/15 border border-white/15 backdrop-blur-md flex items-center justify-center text-white transition-colors cursor-pointer"
                >
                  <nz-icon
                    [nzType]="autoPlay() ? 'pause' : 'caret-right'"
                    class="text-base"
                    aria-hidden="true"
                  />
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    }
  </nz-carousel>
</div>
