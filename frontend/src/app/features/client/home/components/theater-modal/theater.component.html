<div>
  <div class="mb-4">
    <label
      for="theater-modal-select"
      class="block font-semibold mb-2 text-gray-800 dark:text-gray-100"
    >
      {{ "home.selectTheater" | translate }}
    </label>
    <select
      id="theater-modal-select"
      class="w-full p-2 border border-border rounded-lg bg-white dark:bg-[#161a20] text-gray-800 dark:text-gray-100 min-h-11"
      (change)="onSelect($event)"
      [value]="selectedTheaterId() ?? ''"
    >
      @for (theater of theaters(); track theater.id) {
        <option [value]="theater.id">
          {{ theater.name }}
        </option>
      }
    </select>
  </div>
</div>
