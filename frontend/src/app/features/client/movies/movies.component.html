<div class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
  <div class="flex flex-col gap-4 mb-6">
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-gray-100">
      {{ "home.movieList" | translate }}
    </h1>
    <div class="flex flex-col sm:flex-row gap-3 sm:items-center">
      <nz-tabset
        class="flex-1"
        [nzSelectedIndex]="tabIndex()"
        (nzSelectedIndexChange)="onTabChange($event)"
      >
        <nz-tab [nzTitle]="tabTitles().all" />
        <nz-tab [nzTitle]="tabTitles().now" />
        <nz-tab [nzTitle]="tabTitles().upcoming" />
      </nz-tabset>
      <div class="w-full sm:w-[220px]">
        <nz-input-group nzPrefixIcon="search" class="rounded-lg">
          <input
            nz-input
            [placeholder]="'home.searchMovie' | translate"
            [ngModel]="search()"
            (ngModelChange)="onSearchChange($event)"
            maxlength="255"
          />
        </nz-input-group>
      </div>
      <nz-select
        class="w-full sm:w-[160px]"
        [ngModel]="sort()"
        (ngModelChange)="onSortChange($event)"
        [ariaLabel]="'movies.sort' | translate"
      >
        <nz-option
          nzValue="newest"
          [nzLabel]="'movies.sortNewest' | translate"
        />
        <nz-option
          nzValue="oldest"
          [nzLabel]="'movies.sortOldest' | translate"
        />
      </nz-select>
    </div>
  </div>

  @if (loading()) {
    <div nz-row [nzGutter]="[16, 24]" class="mt-8">
      @for (_ of [1, 2, 3, 4, 5, 6]; track _) {
        <div nz-col [nzXs]="12" [nzSm]="8" [nzMd]="6" [nzLg]="4">
          <nz-skeleton
            [nzActive]="true"
            [nzTitle]="false"
            [nzParagraph]="{ rows: 3, width: ['100%', '60%', '40%'] }"
            class="block"
          />
        </div>
      }
    </div>
  } @else if (loadError()) {
    <app-error-state [message]="loadError() ?? ''" (retry)="reload()" class="mt-8 block" />
  } @else if (filtered().length === 0) {
    <div class="mt-16 text-center">
      <nz-empty [nzNotFoundContent]="'home.noMatch' | translate">
        <div nz-row [nzJustify]="'center'" class="mt-4">
          <button nz-button nzType="primary" (click)="clearFilter()">
            {{ "movies.clearFilter" | translate }}
          </button>
        </div>
      </nz-empty>
    </div>
  } @else {
    <div nz-row [nzGutter]="[16, 24]" class="mt-8">
      @for (movie of visible(); track movie.id) {
        <div nz-col [nzXs]="12" [nzSm]="8" [nzMd]="6" [nzLg]="4">
          <app-movie-item
            [movie]="movie"
            [canBook]="isNowShowing(movie)"
            (selectMovie)="onSelectMovie($event)"
          />
        </div>
      }
    </div>
    @if (visible().length < filtered().length) {
      <div class="mt-8 text-center">
        <button nz-button nzType="default" (click)="maybeGrow()">
          {{ "movies.showMore" | translate }} ({{ filtered().length - visible().length }})
        </button>
      </div>
    }
  }
</div>
