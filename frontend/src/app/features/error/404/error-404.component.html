<nz-result
  class="bg-background max-w-lg mx-auto rounded-lg p-8"
  [nzIcon]="Icon"
  [nzTitle]="Title"
  [nzSubTitle]="Subtitle"
>
  <div nz-result-extra>
    <button nz-button nzType="primary" nzShape="round" (click)="goToHomePage()">
      {{ "error.homePage" | translate }}
    </button>
  </div>
</nz-result>

<ng-template #Title>
  <h1 class="ant-result-title text-4xl font-bold">
    {{ "error.oops" | translate }}
  </h1>
</ng-template>

<ng-template #Subtitle>
  <h1 class="ant-result-subtitle text-sm">
    {{ "error.notFoundText" | translate }}
  </h1>
</ng-template>

<ng-template #Icon>
  <img
    src="assets/illustrations/404.svg"
    alt="404 Not Found Illustration"
    loading="lazy"
    class="w-full h-full"
  />
</ng-template>
